# Client Configuration File

# Client identifier
client.label=client1

# Source directories to watch for files (comma-separated)
source.directories=/tmp/filehandler/source1,/tmp/filehandler/source2

# Server connection details
server.ip=127.0.0.1
server.port=9000

# Encryption key for file security
encryption.key=ThisIsASecretKey123456789012345

# Log file location
log.file.path=logs/client.log
log.level=INFO 